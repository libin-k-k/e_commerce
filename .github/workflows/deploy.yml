name: Deploy to Hostinger (Development)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build (Composer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, bcmath, curl, openssl, pdo, tokenizer, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-redis

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code to Hostinger
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'EOF'
            set -e
            echo "Connected to server..."
            cd ${{ secrets.HOSTINGER_PATH }}

            # Pull first so custom maintenance view exists, then go into maintenance for composer/migrate
            trap 'php artisan up' EXIT INT TERM
            git fetch --all
            git checkout dev || git checkout -b dev origin/dev
            git pull origin dev

            # Show new files / changes
            echo "Files changed on server:"
            git status

            # Composer install
            if [ -f composer.phar ]; then
              php composer.phar install --no-interaction --prefer-dist --ignore-platform-req=ext-redis
            else
              composer install --no-interaction --prefer-dist --ignore-platform-req=ext-redis
            fi

            # Artisan commands
            php artisan migrate --force
            php artisan db:seed --force
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            echo "Deployment finished!"
          EOF
